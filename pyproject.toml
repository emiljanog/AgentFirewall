[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfirewall-poc"
version = "0.1.0"
description = "Experimental local security policy guard for Claude Code tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "AgentFirewall Contributors"}]
keywords = ["agent-security", "claude-code", "hooks", "ai-security"]

[project.scripts]
agentfirewall = "agentfirewall.cli:main"

[tool.setuptools.packages.find]
include = ["agentfirewall*"]
